<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impromptu AI Speaker</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Inter", "Segoe UI", sans-serif;
}

body {
    min-height: 100vh;
    background: #090D0C;
    color: #F2E8DA;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
}

body::before,
body::after {
    content: "";
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    filter: blur(70px);
    opacity: 0.85;
    animation: drift 18s ease-in-out infinite alternate;
}

body::before {
    background: radial-gradient(circle at 20% 20%, rgba(92, 156, 114, 0.28), transparent 28%),
                radial-gradient(circle at 80% 25%, rgba(74, 143, 138, 0.25), transparent 32%),
                radial-gradient(circle at 50% 80%, rgba(216, 139, 82, 0.18), transparent 26%);
}

body::after {
    animation-duration: 24s;
    background: radial-gradient(circle at 30% 80%, rgba(92, 156, 114, 0.18), transparent 22%),
                radial-gradient(circle at 80% 70%, rgba(74, 143, 138, 0.2), transparent 24%);
}

@keyframes drift {
    from { transform: translate3d(-3%, -2%, 0) scale(1); }
    to { transform: translate3d(3%, 2%, 0) scale(1.04); }
}

.app-shell {
    position: relative;
    z-index: 1;
    width: min(900px, 100%);
}

.app-card {
    position: relative;
    width: 100%;
    min-height: 620px;
    border-radius: 32px;
    background: rgba(28, 27, 24, 0.78);
    backdrop-filter: blur(28px);
    border: 1px solid rgba(242, 232, 218, 0.12);
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35);
    overflow: hidden;
    padding: 36px;
}

.setup-view,
.presentation-view {
    transition: all 0.35s ease;
}

.setup-view {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 24px;
}

.brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.brand-badge {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, rgba(216, 139, 82, 0.35), rgba(94, 156, 114, 0.35));
    border: 1px solid rgba(242, 232, 218, 0.16);
    font-size: 24px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
}

.brand h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 42px;
    letter-spacing: 0.02em;
    color: #F2E8DA;
}

.brand p {
    color: #AFA79A;
    font-size: 15px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
}

.panel {
    width: min(100%, 620px);
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.controls {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: left;
}

.field label {
    color: #AFA79A;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
}

select {
    padding: 14px 16px;
    border-radius: 999px;
    border: 1px solid rgba(242, 232, 218, 0.16);
    background: rgba(17, 21, 19, 0.75);
    color: #F2E8DA;
    font-size: 15px;
    outline: none;
    appearance: none;
}

select option {
    color: #111513;
}

.actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 999px;
    padding: 13px 20px;
    font-size: 15px;
    font-weight: 600;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    font-family: inherit;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.18);
}

.generate-btn,
.start-btn {
    background: linear-gradient(135deg, #D88B52, #BE6D35);
    color: #fff;
    box-shadow: 0 12px 24px rgba(216, 139, 82, 0.18);
}

.surprise-btn,
.close-btn {
    background: transparent;
    color: #F2E8DA;
    border: 1px solid rgba(242, 232, 218, 0.2);
}

.challenge-block {
    width: 100%;
    padding-top: 10px;
}

.challenge-label {
    color: #AFA79A;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    margin-bottom: 12px;
}

.prompt-box {
    margin-top: 0;
    padding: 10px 10px 6px;
    min-height: 180px;
    border-radius: 28px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 30px;
    line-height: 1.3;
    color: #F2E8DA;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    letter-spacing: 0.01em;
}

.placeholder {
    color: #AFA79A;
    font-family: "Inter", "Segoe UI", sans-serif;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.3em;
}

.presentation-view {
    position: absolute;
    inset: 0;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transform: translateY(12px) scale(0.98);
}

body.presentation-mode .setup-view {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-8px);
}

body.presentation-mode .presentation-view {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0) scale(1);
}

.close-btn {
    position: absolute;
    top: 22px;
    right: 22px;
    z-index: 3;
}

.presentation-inner {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 26px;
    align-items: center;
    text-align: center;
}

.presentation-challenge {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

.presentation-prompt {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 42px;
    line-height: 1.2;
    color: #F2E8DA;
    max-width: 640px;
}

.timer-panel {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
}

.ring-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    display: grid;
    place-items: center;
}

.ring-wrap svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}

.ring-track,
.ring-progress {
    fill: none;
    stroke-width: 10;
}

.ring-track {
    stroke: rgba(242, 232, 218, 0.12);
}

.ring-progress {
    stroke: #5E9C72;
    stroke-linecap: round;
    stroke-dasharray: 339;
    stroke-dashoffset: 339;
    transition: stroke-dashoffset 0.9s linear;
}

.timer-shell {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.timer {
    font-size: 54px;
    font-weight: 700;
    color: #F2E8DA;
    font-family: "Inter", "Segoe UI", sans-serif;
}

.timer-caption {
    color: #AFA79A;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.28em;
}

.guide {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: min(100%, 540px);
}

.step {
    padding: 12px 16px;
    border-radius: 999px;
    background: rgba(242, 232, 218, 0.06);
    border: 1px solid rgba(242, 232, 218, 0.08);
    color: #F2E8DA;
    text-align: left;
    font-size: 14px;
    transition: all 0.25s ease;
}

.step span {
    font-weight: 600;
    color: #F2E8DA;
}

.active {
    background: rgba(94, 156, 114, 0.24);
    border-color: rgba(94, 156, 114, 0.46);
    transform: translateX(4px);
}

.progress {
    position: absolute;
    width: 0%;
    height: 0;
    opacity: 0;
    pointer-events: none;
}

.footer {
    text-align: center;
    color: #AFA79A;
    font-size: 13px;
    margin-top: 12px;
}

@media (max-width: 760px) {
    .app-card { padding: 26px; min-height: 580px; }
    .brand h1 { font-size: 34px; }
    .prompt-box { font-size: 24px; }
    .presentation-prompt { font-size: 30px; }
    .ring-wrap { width: 200px; height: 200px; }
    .timer { font-size: 44px; }
}

@media (max-width: 600px) {
    body { padding: 12px; }
    .app-card { min-height: auto; padding: 20px; }
    .controls { grid-template-columns: 1fr; }
    .actions { flex-direction: column; }
    button { width: 100%; }
    .prompt-box { min-height: 140px; font-size: 22px; }
    .presentation-view { padding: 18px; }
    .presentation-inner { gap: 18px; }
    .presentation-prompt { font-size: 24px; }
    .ring-wrap { width: 180px; height: 180px; }
    .timer { font-size: 38px; }
    .step { border-radius: 18px; }
}
</style>
</head>
<body>
<div class="app-shell">
  <div class="app-card">
    <section class="setup-view" id="setupView">
      <div class="brand">
        <div class="brand-badge">✦</div>
        <h1>Think Quick!</h1>
        <p>Think Fast. Speak Smart.</p>
      </div>
      <div class="panel">
        <div class="controls">
          <div class="field">
            <label>Type</label>
            <select id="type">
              <option value="question">Question</option>
              <option value="phrase">Word / Phrase</option>
            </select>
          </div>
          <div class="field">
            <label>Category</label>
            <select id="category">
              <option>Technology</option>
              <option>Science</option>
              <option>Nature</option>
              <option>Philosophy</option>
              <option>Education</option>
              <option>Lifestyle</option>
              <option>Business</option>
              <option>History</option>
              <option>Psychology</option>
              <option>Entertainment</option>
              <option>Sports</option>
              <option>General</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button class="generate-btn" onclick="generatePrompt()">Generate Challenge</button>
          <button class="surprise-btn" onclick="surpriseMe()">Surprise Me</button>
          <button class="start-btn" onclick="startTimer()">Start 1-Minute Round</button>
        </div>
        <div class="challenge-block">
          <p class="challenge-label">Current Challenge</p>
          <div class="prompt-box" id="prompt">
            <div class="placeholder">YOUR CHALLENGE</div>
          </div>
        </div>
      </div>
    </section>

    <section class="presentation-view" id="presentationView" aria-hidden="true">
      <button class="close-btn" onclick="exitPresentationMode()">Close</button>
      <div class="presentation-inner">
        <div class="presentation-challenge">
          <p class="challenge-label">Current Challenge</p>
          <div class="presentation-prompt" id="presentationPrompt">YOUR CHALLENGE</div>
        </div>
        <div class="timer-panel">
          <div class="ring-wrap">
            <svg viewBox="0 0 120 120">
              <circle class="ring-track" cx="60" cy="60" r="54"></circle>
              <circle class="ring-progress" id="ringProgress" cx="60" cy="60" r="54"></circle>
            </svg>
            <div class="timer-shell">
              <div class="timer" id="timer">01:00</div>
              <div class="timer-caption">Speak now</div>
            </div>
            <div class="progress" id="progress"></div>
          </div>
        </div>
        <div class="guide">
          <div class="step" id="point"><span>● Point</span></div>
          <div class="step" id="reason"><span>○ Reason</span></div>
          <div class="step" id="example"><span>○ Example</span></div>
          <div class="step" id="conclusion"><span>○ Conclusion</span></div>
        </div>
      </div>
    </section>
  </div>
</div>
<script>
const WORKER_URL = "https://cool-sound-1db8.amberprincessrosana.workers.dev/";
const MODEL = "poolside/laguna-s-2.1:free";

async function generatePrompt(){
    const type = document.getElementById("type").value;
    const category = document.getElementById("category").value;
    const promptBox = document.getElementById("prompt");

    console.log("Type:", type);
    console.log("Category:", category);

    promptBox.innerHTML = `<div class="placeholder loading">✨ AI is thinking...</div>`;
    syncChallengeToPresentation();

    try {
        const result = await generateAI(type, category);

        if (typeof result === 'string' && result.trim().length > 0) {
            promptBox.textContent = result.trim();
            syncChallengeToPresentation();
        } else {
            console.error('AI returned empty result:', result);
            promptBox.innerHTML = `<div class="placeholder">❌ Failed to generate prompt. Please try again.</div>`;
            syncChallengeToPresentation();
        }
    } catch (err) {
        console.error('generatePrompt error:', err);
        promptBox.innerHTML = `<div class="placeholder">❌ Failed to generate prompt. Please try again.</div>`;
        syncChallengeToPresentation();
    }
}

async function generateAI(type, category) {
    console.log('generateAI called with', { type, category });

    let instruction;

    if (type === 'question') {
        instruction = `Generate ONE impromptu speaking question.\n\nCategory:\n${category}\n\nRules:\n- Only return the question\n- One sentence only\n- Easy for students\n- Good for a 1 minute speech\n- No explanation\n- No numbering`;
    } else {
        instruction = `Generate ONE random speaking word or phrase.\n\nCategory:\n${category}\n\nRules:\n- 1 to 3 words only\n- Good for speaking practice\n- No explanation\n- No quotation marks`;
    }

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);

    let response;
    try {
        response = await fetch(WORKER_URL, {
            signal: controller.signal,
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: MODEL, messages: [{ role: 'user', content: instruction }], temperature: 1 })
        });
    } catch (err) {
        clearTimeout(timeout);
        console.error('Network or fetch error:', err);
        throw new Error('Network error while contacting OpenRouter API');
    }

    clearTimeout(timeout);

    if (!response.ok) {
        let errBody = null;
        try { errBody = await response.json(); } catch (e) {}
        console.error('OpenRouter responded with non-OK status', response.status, errBody);
        const msg = errBody?.error?.message || `OpenRouter API error: ${response.status}`;
        throw new Error(msg);
    }

    let data;
    try {
        data = await response.json();
    } catch (err) {
        console.error('Failed to parse OpenRouter JSON response:', err);
        throw new Error('Invalid JSON from OpenRouter API');
    }

    console.log('AI Response:', data);

    if (data?.error) {
        const message = data.error.message || 'OpenRouter returned an error';
        console.error('OpenRouter error payload:', data.error);
        throw new Error(message);
    }

    if (!Array.isArray(data.choices) || data.choices.length === 0) {
        console.error('No choices in OpenRouter response:', data);
        throw new Error('No completion returned from OpenRouter');
    }

    const choice = data.choices[0];
    const content = choice?.message?.content || choice?.text || '';

    if (!content || typeof content !== 'string') {
        console.error('Unexpected content format:', choice);
        throw new Error('Invalid completion format from OpenRouter');
    }

    return content.trim().replace(/^['\"]|['\"]$/g, '');
}

function syncChallengeToPresentation() {
    const promptBox = document.getElementById('prompt');
    const presentationPrompt = document.getElementById('presentationPrompt');
    if (!promptBox || !presentationPrompt) return;
    presentationPrompt.textContent = promptBox.textContent || promptBox.innerText || 'YOUR CHALLENGE';
}

function enterPresentationMode() {
    document.body.classList.add('presentation-mode');
}

function exitPresentationMode() {
    document.body.classList.remove('presentation-mode');
}

function surpriseMe() {
    const types = ['question', 'phrase'];
    const typeSelect = document.getElementById('type');
    const categorySelect = document.getElementById('category');
    const categories = Array.from(categorySelect.options).map(opt => opt.value);

    typeSelect.value = types[Math.floor(Math.random() * types.length)];
    const randomCategory = categories[Math.floor(Math.random() * categories.length)];
    categorySelect.value = randomCategory;

    generatePrompt();
}

document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
        e.preventDefault();
        generatePrompt();
    }
});

let totalTime = 60;
let timeLeft = 60;
let timerInterval = null;

function startTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
    }

    enterPresentationMode();
    timeLeft = totalTime;
    updateTimer();
    clearSteps();

    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();
        updateGuide();

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerFinished();
        }
    }, 1000);
}

function updateTimer() {
    const timer = document.getElementById('timer');
    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    timer.innerHTML = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

    const progress = document.getElementById('progress');
    progress.style.width = (timeLeft / totalTime * 100) + '%';
    syncRingProgress();
}

function syncRingProgress() {
    const progress = document.getElementById('progress');
    const ring = document.getElementById('ringProgress');
    if (!progress || !ring) return;

    const value = parseFloat(progress.style.width) || 0;
    const pct = Math.max(0, Math.min(100, value));
    const radius = 54;
    const circumference = 2 * Math.PI * radius;
    const offset = circumference * (1 - pct / 100);
    ring.style.strokeDasharray = circumference;
    ring.style.strokeDashoffset = offset;
}

function updateGuide() {
    clearSteps();

    if (timeLeft <= 60 && timeLeft >= 50) {
        activateStep('point');
    } else if (timeLeft < 50 && timeLeft >= 35) {
        activateStep('reason');
    } else if (timeLeft < 35 && timeLeft >= 10) {
        activateStep('example');
    } else if (timeLeft < 10) {
        activateStep('conclusion');
    }
}

function activateStep(id) {
    document.getElementById(id).classList.add('active');
}

function clearSteps() {
    const steps = document.querySelectorAll('.step');
    steps.forEach(step => step.classList.remove('active'));
}

function timerFinished() {
    const timer = document.getElementById('timer');
    timer.innerHTML = '00:00';
    clearSteps();
    document.getElementById('conclusion').classList.add('active');
    setTimeout(() => {
        alert('🎉 Time is up! Great job practicing!');
    }, 300);
}
</script>
</body>
</html>
